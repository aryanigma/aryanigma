name: Refresh sector sweep

on:
  schedule:
    - cron: "0 5 * * *"   # ~05:00 UTC daily — new terrain, new fire, new route
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_hero_svg.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # no requirements.txt on purpose — the script is pure stdlib
          # (heapq, random, math, argparse). Nothing to install, nothing
          # to break in CI.

      - name: Generate today's sector sweep
        run: python3 scripts/generate_hero_svg.py --out assets/hero.svg

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate sector sweep [skip ci]"
          file_pattern: "assets/hero.svg"
