<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
<style>
            .terminal { font-family: 'Fira Code', monospace; font-size: 14px; fill: #5ee1ff; }
            .line { white-space: pre; overflow: hidden; border-right: 2px solid #5ee1ff; animation: typing 2s steps(40, end) forwards, blink 0.75s step-end infinite; opacity: 0; }
            @keyframes typing { from { width: 0; opacity: 1; } to { width: 100%; opacity: 1; } }
            @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #5ee1ff; } }
        </style>
<rect width="100%" height="100%" fill="#0d1117" rx="10"/>
<g transform="translate(20, 40)"><text class="terminal line" style="animation-delay: 0.0s; width: 0;">      :::   :::   :::   :::   ::::::::  </text></g>
<g transform="translate(20, 60)"><text class="terminal line" style="animation-delay: 0.4s; width: 0;">    :+:+: :+:+:  :+:   :+:  :+:    :+: </text></g>
<g transform="translate(20, 80)"><text class="terminal line" style="animation-delay: 0.8s; width: 0;">  +:+ +:+:+ +:+  +:+ +:+   +:+         </text></g>
<g transform="translate(20, 100)"><text class="terminal line" style="animation-delay: 1.2000000000000002s; width: 0;"> +#+  +:+  +#+   +#++:     +#++:++#++  </text></g>
<g transform="translate(20, 120)"><text class="terminal line" style="animation-delay: 1.6s; width: 0;">+#+       +#+    +#+             +#+   </text></g>
<g transform="translate(20, 140)"><text class="terminal line" style="animation-delay: 2.0s; width: 0;">#+#       #+#    #+#      #+#    #+#   </text></g>
<g transform="translate(20, 160)"><text class="terminal line" style="animation-delay: 2.4s; width: 0;">###       ###    ###       ########    </text></g>
<g transform="translate(20, 180)"><text class="terminal line" style="animation-delay: 2.8s; width: 0;">                                       </text></g>
<g transform="translate(20, 200)"><text class="terminal line" style="animation-delay: 3.1999999999999997s; width: 0;"> > SYSTEM.BOOT(aryanalikhan)           </text></g>
<g transform="translate(20, 220)"><text class="terminal line" style="animation-delay: 3.5999999999999996s; width: 0;"> > KERNEL LOADED                       </text></g>
<g transform="translate(20, 240)"><text class="terminal line" style="animation-delay: 3.9999999999999996s; width: 0;"> > INITIALIZING CHRONO RIFT ENGINE...  </text></g>
<g transform="translate(20, 260)"><text class="terminal line" style="animation-delay: 4.3999999999999995s; width: 0;"> > CONNECTION ESTABLISHED              </text></g>
</svg>